<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MGRS Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/print.css" />
  </head>
  <body>
    <div id="app">
      <p id="no-webgl" class="no-webgl" hidden></p>

      <header class="chrome" id="chrome">
        <div class="brand">
          <span class="app-name" id="app-name"></span>
        </div>
        <form id="search-form" autocomplete="off">
          <label class="sr-only" for="search-input" id="search-aria-label"></label>
          <input
            id="search-input"
            name="q"
            type="search"
            spellcheck="false"
          />
          <button type="button" id="search-clear" class="ghost" hidden></button>
          <button type="submit" id="search-submit"></button>
        </form>
        <button type="button" id="print-btn"></button>
        <p id="search-helper" class="search-helper"></p>
        <p id="search-hint" class="search-hint" hidden></p>
        <p id="search-note" class="search-note" hidden></p>
        <div id="search-formats" class="search-formats" hidden>
          <p class="formats-h" id="formats-heading"></p>
          <p id="fmt-mgrs100"></p>
          <p id="fmt-mgrs1k"></p>
          <p id="fmt-mgrs10k"></p>
          <p id="fmt-decimal"></p>
          <p id="fmt-dms"></p>
          <p id="fmt-place"></p>
        </div>
      </header>

      <div id="map" role="application" aria-label="Topographic map"></div>
      <div id="print-frame" class="print-frame" aria-hidden="true"></div>
      <div id="crosshair" class="crosshair" aria-hidden="true"></div>

      <div id="map-status" class="map-status" hidden>
        <span class="status-text"></span>
        <button type="button" id="tile-retry" hidden></button>
      </div>

      <div class="hud" id="hud">
        <div class="hud-block">
          <span id="scale-readout"></span>
          <span id="hud-zoom-interval"></span>
          <span id="center-mgrs"></span>
        </div>
        <div id="scale-bar" class="scale-bar" hidden>
          <span class="scale-bar-track"></span>
          <span class="scale-bar-label"></span>
        </div>
        <p id="tile-source" class="tile-source"></p>
        <p id="grid-unavailable" class="grid-unavailable" hidden></p>
      </div>

      <div id="print-sheet" class="print-sheet">
        <div class="print-upper-collar">
          <span id="print-product" class="print-product"></span>
          <span id="print-upper-title" class="print-upper-title"></span>
        </div>
        <div class="print-neatline" aria-hidden="true"></div>
        <div class="print-lower-collar">
          <div class="print-col print-col-a">
            <h1 id="print-title" class="print-title"></h1>
            <p class="print-series" id="print-series"></p>
            <p class="print-subtitle" id="print-subtitle"></p>
            <dl class="print-spec">
              <div>
                <dt id="lbl-print-scale"></dt>
                <dd id="print-scale"></dd>
              </div>
              <div>
                <dt id="lbl-print-grid"></dt>
                <dd id="print-grid-value"></dd>
              </div>
              <div id="print-grid-interval-row">
                <dt id="lbl-print-grid-interval"></dt>
                <dd id="print-grid-interval"></dd>
              </div>
              <div>
                <dt id="lbl-print-datum"></dt>
                <dd id="print-datum-value"></dd>
              </div>
              <div>
                <dt id="lbl-print-projection"></dt>
                <dd id="print-projection-value"></dd>
              </div>
            </dl>
          </div>
          <div class="print-col print-col-b">
            <p class="print-north-label" id="lbl-print-north"></p>
            <svg class="print-north-arrow" viewBox="0 0 40 56" width="40" height="40" aria-hidden="true">
              <polygon points="20,0 30,30 20,24 10,30" fill="#1C1914" />
              <line x1="20" y1="24" x2="20" y2="52" stroke="#1C1914" stroke-width="2.2" />
            </svg>
            <p class="print-true-north" id="lbl-print-true-north"></p>
            <div id="print-scale-bar" class="print-scale-bar"></div>
          </div>
          <div class="print-col print-col-c">
            <p class="legend-h" id="lbl-print-legend"></p>
            <ul>
              <li><i class="swatch roads"></i><span id="leg-roads"></span></li>
              <li><i class="swatch water"></i><span id="leg-water"></span></li>
              <li><i class="swatch contours"></i><span id="leg-contours"></span></li>
              <li><i class="swatch grid"></i><span id="leg-grid"></span></li>
              <li><i class="swatch places"></i><span id="leg-places"></span></li>
              <li><i class="swatch relief"></i><span id="leg-relief"></span></li>
            </ul>
          </div>
          <div class="print-col print-col-d">
            <div class="print-meta-block">
              <span class="meta-lbl" id="lbl-print-printed"></span>
              <strong id="print-date"></strong>
            </div>
            <div class="print-meta-block">
              <span class="meta-lbl" id="lbl-print-sheet"></span>
              <strong id="print-sheet-value" class="sheet-value"></strong>
            </div>
          </div>
        </div>
        <div class="print-page-footer">
          <p class="print-disclaimer" id="print-disclaimer"></p>
          <p class="print-attr" id="print-attr"></p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
