<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2B2924" />
    <title>MGRS Viewer</title>
    <link rel="icon" href="./icon/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="./icon/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icon/apple-touch-180.png" sizes="180x180" />
    <link rel="icon" href="./icon/app-icon-512.png" sizes="512x512" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/print.css" />
    <script>
      if (typeof window.__mgrsNativePrint !== 'function') {
        window.__mgrsNativePrint = window.print.bind(window);
      }
      window.__mgrsAllowPrint = false;
      window.print = function () { return; };
      window.addEventListener('keydown', function (ev) {
        if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'p' || ev.key === 'P' || ev.code === 'KeyP')) {
          ev.preventDefault();
          ev.stopImmediatePropagation();
        }
      }, true);
    </script>

  </head>
  <body>
    <div id="app">
      <div id="no-webgl" class="no-webgl" hidden><img src="./icon/app-icon-512.png" width="48" height="48" alt="" /><p></p></div>

      <header class="chrome" id="chrome">
        <div class="brand">
          <span class="app-name" id="app-name">MGRS Viewer</span>
        </div>
        <form id="search-form" autocomplete="off" action="" method="get" onsubmit="return false" novalidate>
          <label class="sr-only" for="search-input" id="search-aria-label"></label>
          <input
            id="search-input"
            name="q"
            type="text"
            spellcheck="false"
            placeholder="Grid or place"
          />
          <button type="button" id="search-clear" class="ghost" hidden></button>
          <button type="button" id="search-submit" tabindex="-1" hidden></button>
        </form>
        <div class="chrome-tools" id="chrome-tools">
          <div id="zoom-dock" class="zoom-dock"></div>
          <button type="button" id="wysiwyg-btn" class="sheet-toggle on" aria-pressed="true" aria-label="Sheet view. On is the Letter sheet. Off is the full map." title="Sheet view. On is the Letter sheet. Off is the full map.">
            <span id="lbl-wysiwyg">Sheet</span>
            <span class="sheet-track" aria-hidden="true"><span class="sheet-thumb"></span></span>
            <span id="wysiwyg-state">On</span>
          </button>
          <button type="button" id="print-btn">Print</button>
        </div>
        <p id="search-helper" class="search-helper"></p>
        <p id="search-hint" class="search-hint" hidden></p>
      </header>

      <div id="desk">
        <div id="sheet">
          <div id="map" role="application" aria-label="Topographic map"></div>
          <div id="print-ticks" aria-hidden="true"></div>
          <div id="print-sheet" class="print-sheet" aria-hidden="true">
            <div id="print-mask-left" class="print-edge-mask" aria-hidden="true"></div>
            <div id="print-mask-right" class="print-edge-mask" aria-hidden="true"></div>
            <div id="print-upper" class="print-upper-collar">
              <span id="print-product" class="print-product" data-i18n="lbl.product">MGRS MAP VIEWER</span>
              <h1 id="print-title-upper" class="print-title-upper"></h1>
              <span id="print-date-upper" class="print-date-upper"></span>
            </div>
            <div id="print-footer" class="print-lower-collar">
              <div class="print-col print-col-a">
                <h1 id="print-title" class="print-title"></h1>
                <dl class="print-spec">
                  <div>
                    <dt id="lbl-print-scale" data-i18n="print.scale"></dt>
                    <dd id="print-scale"></dd>
                  </div>
                  <div>
                    <dt id="lbl-print-grid" data-i18n="print.grid"></dt>
                    <dd id="print-grid-value" data-i18n="print.gridValue"></dd>
                  </div>
                  <div id="print-grid-interval-row">
                    <dt id="lbl-print-grid-interval" data-i18n="print.gridInterval"></dt>
                    <dd id="print-grid-interval"></dd>
                  </div>
                  <div>
                    <dt id="lbl-print-datum" data-i18n="print.datum"></dt>
                    <dd id="print-datum-value" data-i18n="print.datumValue">WGS 84</dd>
                  </div>
                  <div>
                    <dt id="lbl-print-projection" data-i18n="print.projection"></dt>
                    <dd id="print-projection-value"></dd>
                  </div>
                  <div id="print-gzd-row">
                    <dt id="lbl-print-gzd" data-i18n="print.gridZone"></dt>
                    <dd id="print-gzd" class="mono"></dd>
                  </div>
                </dl>
                <div class="print-ident-extra" id="print-example-block" hidden>
                  <p class="print-k" id="lbl-print-example" data-i18n="print.example"></p>
                  <p class="print-v" id="print-example-place"></p>
                  <p class="print-v mono bold" id="print-example-grid"></p>
                  <p class="print-note" id="print-example-note" data-i18n="print.example.note"></p>
                </div>
                <p class="print-series" id="print-series" data-i18n="print.series"></p>
                <p class="print-subtitle" id="print-subtitle" data-i18n="print.subtitle"></p>
              </div>
              <div class="print-col print-col-b">
                <p class="print-col-h" id="lbl-print-scale-bar" data-i18n="print.scaleBar"></p>
                <div id="print-scale-bar" class="print-scale-bar">
                  <div class="psb-track" id="print-scale-track"></div>
                  <div class="psb-labels"><span>0</span><span id="print-scale-end"></span></div>
                </div>
                <p class="print-rf" id="print-scale-center"></p>
                <div class="print-meta-block">
                  <span class="meta-lbl" id="lbl-print-printed" data-i18n="print.printed"></span>
                  <strong id="print-date"></strong>
                </div>
                <div class="print-meta-block">
                  <span class="meta-lbl" id="lbl-print-sheet" data-i18n="print.sheet"></span>
                  <strong id="print-sheet-value" class="sheet-value" data-i18n="print.sheetValue"></strong>
                </div>
              </div>
              <div class="print-col print-col-c">
                <p class="print-north-label" id="lbl-print-north" data-i18n="print.north"></p>
                <svg id="print-gm" class="print-gm" viewBox="0 0 140 96" aria-hidden="true">
                  <line id="gm-tn" x1="70" y1="88" x2="70" y2="10" stroke="#1C1914" stroke-width="1.2"/>
                  <polygon id="gm-tn-head" points="70,4 66.5,13 73.5,13" fill="#1C1914"/>
                  <text id="lbl-north-true" x="74" y="12" font-size="8" font-family="IBM Plex Sans, sans-serif" fill="#1C1914">TN</text>
                  <text id="gm-star" x="62" y="10" font-size="8" fill="#1C1914">★</text>
                  <line id="gm-gn" x1="70" y1="88" x2="78" y2="12" stroke="#1C1914" stroke-width="1"/>
                  <text id="lbl-north-grid" x="80" y="22" font-size="8" font-family="IBM Plex Sans, sans-serif" fill="#1C1914">GN</text>
                  <line id="gm-mn" x1="70" y1="88" x2="48" y2="16" stroke="#1C1914" stroke-width="1.2"/>
                  <polygon id="gm-mn-head" points="48,16 44,24 54,20" fill="#1C1914"/>
                  <text id="lbl-north-magnetic" x="28" y="20" font-size="8" font-family="IBM Plex Sans, sans-serif" fill="#1C1914">MN</text>
                </svg>
                <p class="print-gm-fig mono" id="print-gm-angle"></p>
                <p class="print-gm-fig mono" id="print-gm-conv"></p>
                <p class="print-note" id="print-gm-note"></p>
              </div>
            </div>
            <footer id="print-legal" class="print-legal">
              <p class="print-disclaimer" id="print-disclaimer"></p>
              <p class="print-attr" id="print-attr"></p>
            </footer>
          </div>
        </div>

        <div id="map-status" class="map-status" hidden>
          <span class="status-text"></span>
          <button type="button" id="tile-retry" hidden></button>
        </div>

        <div class="hud" id="hud">
          <span id="scale-readout" class="hud-rf"></span>
          <span id="hud-zoom-interval" class="hud-band"></span>
          <span id="center-mgrs" class="hud-mgrs"></span>
          <div id="scale-bar" class="scale-bar" hidden>
            <span class="scale-bar-track"></span>
            <span class="scale-bar-label"></span>
          </div>
          <p id="tile-source" class="tile-source"></p>
          <p id="grid-unavailable" class="grid-unavailable" hidden></p>
        </div>
      </div>
    </div><!-- #app -->
    <p id="search-note" class="search-note" hidden></p>
    <div id="search-matches" class="search-matches" hidden></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
